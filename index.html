<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tulasi ❤️ Nikhil | Wedding Invitation</title>

    <meta name="description" content="Together with our families, we invite you to celebrate our wedding.">

    <link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=11">

</head>

<body>

    <!-- ==========================
         SCROLL PROGRESS BAR
    =========================== -->

    <div id="progressBar"></div>

    <!-- ==========================
         SECTION DOT NAVIGATION
    =========================== -->

    <nav id="dotNav" aria-label="Section navigation">
        <a href="#section-hero" class="dot active" data-target="section-hero" aria-label="Welcome"><span></span></a>
        <a href="#section-ganesha" class="dot" data-target="section-ganesha" aria-label="Ganesha"><span></span></a>
        <a href="#section-story" class="dot" data-target="section-story" aria-label="Our Story"><span></span></a>
        <a href="#section-functions" class="dot" data-target="section-functions"
            aria-label="Functions"><span></span></a>
        <a href="#section-wedding-day" class="dot" data-target="section-wedding-day"
            aria-label="Wedding Day"><span></span></a>
        <a href="#section-venue" class="dot" data-target="section-venue" aria-label="Venue"><span></span></a>
        <a href="#section-final" class="dot" data-target="section-final" aria-label="RSVP"><span></span></a>
    </nav>

    <!-- ==========================
         LOADER
    =========================== -->

    <div id="loader">

        <div class="door-scene" id="doorScene">

            <div class="door door-left"></div>
            <div class="door door-right"></div>
            <div class="door-seam"></div>

            <div class="parrots" id="parrots" aria-hidden="true">
                <img class="parrot parrot-1" src="images/parrot-flying.png" alt="">
                <img class="parrot parrot-2" src="images/parrot-flying.png" alt="">
                <img class="parrot parrot-3" src="images/parrot-flying.png" alt="">
                <img class="parrot parrot-4" src="images/parrot-flying.png" alt="">
            </div>

            <button type="button" class="open-btn" id="openBtn" aria-label="Open Invitation">
                <span class="open-circle"><span class="heart">&#10084;</span></span>
                <span class="open-label">Open Invitation</span>
            </button>

        </div>

        <audio id="bg-music" src="videoplayback.mp3" preload="auto"></audio>

    </div>

    <!-- ==========================
         INVITATION
    =========================== -->

    <main id="invitation">

        <!-- HERO -->

        <section class="page reveal" id="section-hero">
            <div class="page-wrapper" id="heroPage">
                <video src="hero.mp4" autoplay loop muted playsinline alt="Wedding Invitation"></video>
            </div>
        </section>

        <!-- GANESHA -->

        <section class="page reveal" id="section-ganesha">
            <div class="page-wrapper">
                <img src="images/ganesh.png" alt="Lord Ganesha" loading="lazy">
            </div>
        </section>

        <!-- STORY -->

        <section class="page reveal" id="section-story">
            <div class="page-wrapper">
                <img src="images/story.png" alt="Our Story" loading="lazy">
            </div>
        </section>

        <!-- FUNCTIONS -->

        <section class="page reveal" id="section-functions">
            <div class="page-wrapper" id="functionsPage">

                <video src="Animate_this_entire_wedding_in (2).mp4" autoplay loop muted playsinline
                    alt="Wedding Functions"></video>

                <a class="fn-location-link" id="loc-mehendi"
                    href="https://www.google.com/maps/search/?api=1&query=14.411417,79.972417" target="_blank"
                    rel="noopener" aria-label="Mehendi location, Nellore — open in Maps"></a>

                <a class="fn-location-link" id="loc-nalugu" href="https://maps.app.goo.gl/SpaqmqtCK8bdGTqH6"
                    target="_blank" rel="noopener" aria-label="Nalugu location, Nellore — open in Maps"></a>

                <a class="fn-location-link" id="loc-haldi" href="https://share.google/drORNzEO7gZUbiPwt" target="_blank"
                    rel="noopener" aria-label="Haldi location, Bhadrachalam — open in Maps"></a>

                <a class="fn-location-link" id="loc-sangeet" href="https://share.google/drORNzEO7gZUbiPwt"
                    target="_blank" rel="noopener" aria-label="Sangeet location, Bhadrachalam — open in Maps"></a>

            </div>
        </section>

        <!-- WEDDING DAY -->

        <section class="page reveal" id="section-wedding-day">
            <div class="page-wrapper">
                <img src="images/wedding-day.png" alt="Wedding Day" loading="lazy">
            </div>
        </section>

        <!-- VENUE -->

        <section class="page reveal" id="section-venue">

            <div class="page-wrapper" id="venuePage">

                <img src="images/venue.png" alt="Venue" loading="lazy">

                <div class="venue-overlay">

                    <a class="venue-button"
                        href="https://www.google.com/maps/search/?api=1&query=Suguna+Gardens,+Palwancha,+Telangana"
                        target="_blank">
                        View Location
                    </a>

                </div>

            </div>

        </section>

        <!-- FINAL -->

        <section class="page reveal" id="section-final">

            <div class="page-wrapper" id="finalPage">

                <img src="images/final.png" alt="Wedding Invitation" loading="lazy">

                <div class="countdown-overlay">

                    <div class="countdown-box">

                        <div class="count-item">
                            <span id="days">00</span>
                            <small>Days</small>
                        </div>

                        <div class="count-item">
                            <span id="hours">00</span>
                            <small>Hours</small>
                        </div>

                        <div class="count-item">
                            <span id="minutes">00</span>
                            <small>Minutes</small>
                        </div>

                        <div class="count-item">
                            <span id="seconds">00</span>
                            <small>Seconds</small>
                        </div>

                    </div>

                </div>

                <div class="rsvp-overlay">

                    <div class="rsvp-buttons">

                        <div class="rsvp-btn-row">

                            <button id="yesBtn">
                                💖 Yes
                            </button>

                            <button id="noBtn">
                                ❤️ No
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- ==========================
         RSVP POPUP
    =========================== -->

    <div id="popup" class="popup">

        <div class="popup-card">

            <span id="closePopup">&times;</span>

            <h2 id="popupTitle"></h2>

            <p id="popupMessage"></p>

            <a id="popupFormLink" class="popup-form-link" href="#" target="_blank" rel="noopener noreferrer">
                Click here to RSVP
            </a>

        </div>

    </div>

    <!-- ==========================
         BACK TO TOP
    =========================== -->

    <button id="topButton">↑</button>

    <script src="script.js?v=14"></script>

</body>

</html>
